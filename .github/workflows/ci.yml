name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.3"

jobs:
  powershell:
    name: PowerShell lint, tests, bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force
          "Pester $((Get-Module Pester -ListAvailable | Sort-Object Version -Descending)[0].Version)"
          "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer -ListAvailable | Sort-Object Version -Descending)[0].Version)"

      # The refactored code has to pass what the legacy script never did.
      - name: Analyze the module and scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path module, scripts, tests -Recurse -Settings PSGallery
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer is clean."

      # The legacy script is kept as the "before" and is expected to be bad;
      # this records how bad, rather than pretending it passes.
      - name: Measure the legacy script
        shell: pwsh
        run: |
          $legacy = Invoke-ScriptAnalyzer -Path legacy -Recurse -Settings PSGallery
          $count = @($legacy).Count
          Write-Host "Legacy script: $count analyzer findings (kept as the 'before')."
          $legacy | Group-Object RuleName | Sort-Object Count -Descending |
            Select-Object Count, Name | Format-Table -AutoSize | Out-String | Write-Host
          "legacy_findings=$count" >> $env:GITHUB_ENV

      - name: Test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Build the bundles
        shell: pwsh
        run: |
          ./scripts/Build-Bundle.ps1 -Mode Audit
          ./scripts/Build-Bundle.ps1 -Mode WhatIf
          ./scripts/Build-Bundle.ps1 -Mode Remediate
          Get-ChildItem out | Format-Table Name, Length

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "### PowerShell" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "The refactored module passes PSScriptAnalyzer with zero findings; the legacy script it replaces has $env:legacy_findings." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bundles-and-test-results
          path: |
            out/*.ps1
            testResults.xml
          if-no-files-found: warn

  terraform:
    name: Terraform format, validate, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          for dir in bootstrap infra; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v6

      - name: Lint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  security:
    name: Checkov policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml

  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [powershell, terraform, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - name: Mask Azure identifiers
        run: |
          echo "::add-mask::$ARM_SUBSCRIPTION_ID"
          echo "::add-mask::$ARM_TENANT_ID"
          echo "::add-mask::$ARM_CLIENT_ID"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=infra.tfstate"

      - name: Plan
        run: >-
          terraform plan -input=false -lock-timeout=5m
          -var="resource_group_name=${{ vars.LAB_RESOURCE_GROUP }}"
